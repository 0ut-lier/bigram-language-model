[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bigram-language-model"
version = "0.1.0"
description = "A character-level bigram language model implemented from scratch with PyTorch."
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "torch",
    "requests",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
